# Use runtime: docker so Render builds with the repo Dockerfile (npm + pip + collectstatic).
# If you prefer native Python build, set runtime: python, buildCommand to the one-liner in README, startCommand: cd backend && gunicorn config.wsgi --bind 0.0.0.0:$PORT
services:
  - type: web
    name: chemical-equipment-visualizer
    runtime: docker
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOW_CREATE_DEFAULT_USER
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
