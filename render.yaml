services:
  - type: web
    name: chemical-equipment-visualizer
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOW_CREATE_DEFAULT_USER
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
